[project]
name = "gastbot"
version = "0.1.0"
description = ""
authors = [
    {name = "SenhorDosSonhos1",email = "marcelosamu2002@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.5,<0.17.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.taskipy.tasks]
run = "poetry run uvicorn app.main:app --reload"
format = "ruff format ."
lint = "ruff check ."
fix = "ruff check . --fix"
docker = "docker compose up -d --build"